<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Online Compiler | CodeStart</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Consolas:wght@400;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="languages.css">

  <!-- Compiler Specific CSS -->
  <link rel="stylesheet" href="java-compiler.css">

  <!-- Puter.js for Serverless AI access -->
  <script src="https://js.puter.com/v2/"></script>

  <!-- Chatbot CSS -->
  <link rel="stylesheet" href="chatbot.css">
</head>

<body>

  <!-- Dynamic Background Elements -->
  <div class="bg-shape shape-1" style="background: radial-gradient(circle, rgba(239,68,68,0.2) 0%, transparent 70%);">
  </div>
  <div class="bg-shape shape-2" style="background: radial-gradient(circle, rgba(249,115,22,0.2) 0%, transparent 70%);">
  </div>
  <div class="bg-shape shape-3" style="background: radial-gradient(circle, rgba(239,68,68,0.15) 0%, transparent 70%);">
  </div>

  <!-- Header -->
  <header>
    <div class="container header-container">
      <div class="logo">
        <i class="fa-brands fa-java" style="color: #ef4444;"></i> Java<span>Compiler</span>
      </div>
      <button onclick="goBack()" class="btn-home">
        <i class="fa-solid fa-arrow-left"></i> Back to Notes
      </button>
    </div>
  </header>

  <!-- Compiler Area -->
  <div class="compiler-wrapper">
    <div class="compiler-container fade-in-up">
      <div class="glass-compiler-panel">

        <div class="compiler-header">
          <span><i class="fa-brands fa-java" style="color:#fca5a5; margin-right:5px;"></i> Main.java</span>
          <button class="btn-run" onclick="runit()" id="runBtn"><i class="fa-solid fa-play"></i> Run Code</button>
        </div>

        <div class="compiler-body">
          <div class="editor-pane">
            <textarea id="code" spellcheck="false" autocomplete="off">public class Main {
    public static void main(String[] args) {
        System.out.println("☕ Welcome to CodeStart Java Compiler!");
        System.out.println("Let's write some Object-Oriented code.");
        
        for(int i = 1; i <= 3; i++) {
            System.out.println("Java iteration: " + i);
        }
    }
}</textarea>
          </div>

          <div class="middle-resizer"></div>

          <div class="output-pane">
            <div class="output-header">Terminal Output</div>
            <div id="terminal">
              <div id="output"></div>
              <div class="spinner" id="loadingSpinner" style="display:none; color: #ef4444; margin-top: 10px;"><i
                  class="fa-solid fa-circle-notch fa-spin"></i> Compiling & Executing...</div>
            </div>
            <!-- Standard Input Box -->
            <div class="stdin-pane">
              <div class="output-header">Standard Input (Provide before run)</div>
              <textarea id="stdinBox" spellcheck="false"
                placeholder="Enter input for Scanner, etc. here before clicking Run..."></textarea>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- AI Chat Button -->
  <button class="ai-chat-btn" onclick="toggleChat()" aria-label="Ask AI Assistant">
    <i class="fa-solid fa-robot"></i>
  </button>

  <!-- AI Chat Panel -->
  <div class="ai-chat-panel" id="aiChatPanel">
    <div class="chat-header">
      <div class="chat-title">
        <i class="fa-solid fa-robot"></i> CodeStart AI Tutor
      </div>
      <button class="chat-close" onclick="toggleChat()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="msg msg-ai">Hello! 👋 I'm your Java AI coding tutor. Stuck on a class definition or an exception? Ask me anything!</div>
      <div class="typing-indicator" id="typingIndicator">
        <div class="typing-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
    <div class="chat-input-area">
      <input type="text" class="chat-input" id="chatInput" placeholder="Type your question..."
        onkeypress="handleKeyPress(event)">
      <button class="chat-send" onclick="sendMessage()">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <script src="java-compiler.js"></script>


  <!-- Chatbot JS -->
  <script src="chatbot.js"></script>
</body>

</html>
