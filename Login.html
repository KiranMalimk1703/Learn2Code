<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn2code | Login & Signup</title>

  <!-- CSS -->
  <link rel="stylesheet" href="Login.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- Chatbot CSS -->
  <link rel="stylesheet" href="chatbot.css">
</head>

<body>

  <!-- Background Animated Shapes -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <!-- Header to go back to home -->
  <header>
    <div class="header-container container">
      <div class="logo">
        <i class="fa-solid fa-code" style="color: #60a5fa;"></i> Code<span>Start</span>
      </div>
      <a href="index.html" class="btn-home">
        <i class="fa-solid fa-house"></i> Home
      </a>
    </div>
  </header>

  <div class="container main-container">
    <div class="form-wrapper fade-in-up">
      <div class="glass-panel form-box delay-1">
        <h2 id="formTitle" class="gradient-text text-center">Welcome Back</h2>
        <p class="subtitle text-center" id="formSubtitle">Login to continue your learning journey</p>

        <form id="authForm">
          <div class="input-group">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="username" placeholder="Username or Email" required autocomplete="username">
          </div>

          <div class="input-group signup-only" id="emailGroup">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="email" placeholder="Email Address (for real cloud auth)" autocomplete="email">
          </div>

          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            <i class="fa-regular fa-eye toggle-password" id="togglePasswordBtn" title="Toggle password visibility"></i>
          </div>

          <!-- Password strength meter for signup -->
          <div class="password-strength-wrap" id="passwordStrengthWrap">
            <div class="password-strength-track">
              <div class="password-strength-fill" id="passwordStrengthFill"></div>
            </div>
            <div class="password-strength-label">
              <span>Password strength</span>
              <span id="passwordStrengthText" style="font-weight: 600;">Weak</span>
            </div>
          </div>

          <!-- Remember me row -->
          <div class="remember-row">
            <label class="remember-checkbox">
              <input type="checkbox" id="rememberMeCheckbox" checked>
              <span>Remember me</span>
            </label>
            <a href="#" onclick="showToast('Password reset link sent to your registered email.', 'info'); return false;" style="color: #60a5fa; text-decoration: none; font-size: 13px;">Forgot?</a>
          </div>

          <button type="submit" class="btn btn-primary" id="submitBtn">
            Login <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <p class="toggle-text text-center delay-3">
          <span id="toggleQuestion">Don't have an account?</span>
          <span class="highlight-link" onclick="toggleForm()" id="toggleAction">Sign Up</span>
        </p>
      </div>
    </div>
  </div>

  <!-- Toast Notification System -->
  <script src="toast.js"></script>

  <!-- Firebase Compat CDN (Optional live connection) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- Firebase Configuration & Social Data Engine -->
  <script src="firebase-config.js"></script>

  <!-- Login Logic -->
  <script src="Login.js"></script>

  <!-- Chatbot JS -->
  <script src="chatbot.js"></script>
</body>

</html>
