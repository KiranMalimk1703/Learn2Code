<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Online Compiler | Learn2code</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Consolas:wght@400;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="languages.css">

  <!-- Compiler Specific CSS -->
  <link rel="stylesheet" href="javascript-compiler.css">

  <!-- Puter.js for Serverless AI access -->
  <script src="https://js.puter.com/v2/"></script>

  <!-- Chatbot CSS -->
  <link rel="stylesheet" href="chatbot.css">
</head>

<body>

  <!-- Dynamic Background Elements -->
  <div class="bg-shape shape-1" style="background: radial-gradient(circle, rgba(247, 223, 30, 0.2) 0%, transparent 70%);">
  </div>
  <div class="bg-shape shape-2" style="background: radial-gradient(circle, rgba(240, 165, 0, 0.2) 0%, transparent 70%);">
  </div>
  <div class="bg-shape shape-3" style="background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);">
  </div>

  <!-- Header -->
  <header>
    <div class="container header-container">
      <div class="logo">
        <i class="fa-brands fa-js" style="color: #f7df1e;"></i> JS<span>Compiler</span>
      </div>
      <button onclick="goBack()" class="btn-home">
        <i class="fa-solid fa-arrow-left"></i> Back to Notes
      </button>
    </div>
  </header>

  <!-- Compiler Area -->
  <div class="compiler-wrapper">
    <div class="compiler-container fade-in-up">
      <div class="glass-compiler-panel">

        <div class="compiler-header">
          <span class="compiler-filename-tab"><i class="fa-brands fa-node-js" style="color:#68a063; margin-right:5px;"></i> index.js</span>
          <div class="compiler-toolbar">
            <div class="toolbar-group">
              <select class="toolbar-select" id="templateSelect" title="Load a template">
                <option value="">📋 Templates</option>
              </select>
            </div>
            <div class="toolbar-group toolbar-font-size">
              <button class="toolbar-btn" id="fontDecrBtn" title="Decrease font size"><i class="fa-solid fa-minus"></i></button>
              <span class="font-size-label" id="fontSizeLabel">14px</span>
              <button class="toolbar-btn" id="fontIncrBtn" title="Increase font size"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div class="toolbar-group">
              <button class="toolbar-btn" id="copyBtn" title="Copy code"><i class="fa-solid fa-copy"></i></button>
              <button class="toolbar-btn" id="clearOutBtn" title="Clear terminal output"><i class="fa-solid fa-broom"></i></button>
              <button class="toolbar-btn" id="fullscreenBtn" title="Toggle fullscreen"><i class="fa-solid fa-expand"></i></button>
            </div>
            <button class="btn-run" onclick="runit()" id="runBtn"><i class="fa-solid fa-play"></i> Run <kbd class="run-kbd">Ctrl+↵</kbd></button>
          </div>
        </div>

        <div class="compiler-body">
          <div class="editor-pane">
            <textarea id="code" spellcheck="false" autocomplete="off">console.log("Welcome to Learn2code JavaScript Compiler!");
console.log("Let's write some JS code.\n");

for (let i = 1; i <= 3; i++) {
    console.log("Counting: " + i);
}</textarea>
          </div>

          <div class="middle-resizer"></div>

          <div class="output-pane">
            <div class="output-header">Terminal Output <span class="exec-time" id="execTime"></span></div>
            <div id="terminal">
              <div id="output"></div>
              <div class="spinner" id="loadingSpinner" style="display:none; color: #f7df1e; margin-top: 10px;"><i
                  class="fa-solid fa-circle-notch fa-spin"></i> Executing...</div>
            </div>
            <!-- Standard Input Box for Compiler -->
            <div class="stdin-pane">
              <div class="output-header">Standard Input (Provide before run)</div>
              <textarea id="stdinBox" spellcheck="false"
                placeholder="Enter standard input here before clicking Run..."></textarea>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- AI Chat Button -->
  <button class="ai-chat-btn" onclick="toggleChat()" aria-label="Ask AI Assistant">
    <i class="fa-solid fa-robot"></i>
  </button>

  <!-- AI Chat Panel -->
  <div class="ai-chat-panel" id="aiChatPanel">
    <div class="chat-header">
      <div class="chat-title">
        <i class="fa-solid fa-robot"></i> Learn2code AI Tutor
      </div>
      <button class="chat-close" onclick="toggleChat()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="msg msg-ai">Hello! 👋 I'm your AI coding tutor. Stuck on a JavaScript programming problem or encountering an
        error? Ask me anything!</div>
      <div class="typing-indicator" id="typingIndicator">
        <div class="typing-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
    <div class="chat-input-area">
      <input type="text" class="chat-input" id="chatInput" placeholder="Type your question..."
        onkeypress="handleKeyPress(event)">
      <button class="chat-send" onclick="sendMessage()">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <script src="toast.js"></script>
  <script src="firebase-config.js"></script>
  <script src="gamification.js"></script>
  <script src="compiler-history.js"></script>
  <script src="javascript-compiler.js"></script>


  <!-- Chatbot JS -->
  <script src="chatbot.js"></script>
</body>

</html>
